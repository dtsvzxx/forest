[versions]
androidx-lifecycle = "2.11.0-beta01"
composeMultiplatform = "1.11.1"
jediterm = "3.74"
# The grammars pull the core up to this; asking for less only makes the file lie.
treesitter = "0.26.3"
junit = "4.13.2"
kotlin = "2.4.10"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
material3 = "1.11.0-alpha07"
pty4j = "0.13.12"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
jediterm-core = { module = "org.jetbrains.jediterm:jediterm-core", version.ref = "jediterm" }
jediterm-ui = { module = "org.jetbrains.jediterm:jediterm-ui", version.ref = "jediterm" }
pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }

# Syntax highlighting. The core carries the parser for every platform we ship; each grammar is a
# separate artefact, and each one is a megabyte or so of bundle — the list below is the list of
# languages a diff is coloured in, and adding or removing one is a line.
treesitter-core = { module = "io.github.bonede:tree-sitter", version.ref = "treesitter" }
treesitter-kotlin = { module = "io.github.bonede:tree-sitter-kotlin", version = "0.3.8.1" }
treesitter-java = { module = "io.github.bonede:tree-sitter-java", version = "0.23.5" }
treesitter-javascript = { module = "io.github.bonede:tree-sitter-javascript", version = "0.25.0" }
treesitter-typescript = { module = "io.github.bonede:tree-sitter-typescript", version = "0.23.2" }
treesitter-python = { module = "io.github.bonede:tree-sitter-python", version = "0.25.0" }
treesitter-go = { module = "io.github.bonede:tree-sitter-go", version = "0.25.0" }
treesitter-rust = { module = "io.github.bonede:tree-sitter-rust", version = "0.24.0" }
treesitter-c = { module = "io.github.bonede:tree-sitter-c", version = "0.24.1" }
treesitter-bash = { module = "io.github.bonede:tree-sitter-bash", version = "0.25.1" }
treesitter-json = { module = "io.github.bonede:tree-sitter-json", version = "0.24.8" }
treesitter-yaml = { module = "io.github.bonede:tree-sitter-yaml", version = "0.5.0a" }
treesitter-markdown = { module = "io.github.bonede:tree-sitter-markdown", version = "0.7.1a" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
